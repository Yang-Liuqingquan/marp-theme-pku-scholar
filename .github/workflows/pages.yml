name: Build demo & deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check theme
        run: node scripts/check-theme.mjs

      # 只构建 HTML：不需要浏览器，CI 里最省事
      - name: Build demo
        run: npx --yes @marp-team/marp-cli@4.2.3 --theme-set themes --html examples/demo.md -o _site/index.html

      - name: Copy example images
        run: |
          mkdir -p _site/images
          cp examples/images/* _site/images/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-label="三段式流程图：地面观测、空间插值、栅格场">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="'霞鹜文楷','LXGW WenKai',KaiTi,'Microsoft YaHei',sans-serif" font-size="26" text-anchor="middle">
    <rect x="12" y="60" width="170" height="110" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
    <text x="97" y="112" fill="#000">地面观测</text>
    <text x="97" y="146" font-size="19" fill="#57606a">站点日值</text>

    <rect x="235" y="60" width="170" height="110" rx="10" fill="#fff" stroke="#94070a" stroke-width="2"/>
    <text x="320" y="112" fill="#000">空间插值</text>
    <text x="320" y="146" font-size="19" fill="#94070a">克里金法</text>

    <rect x="458" y="60" width="170" height="110" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
    <text x="543" y="112" fill="#000">栅格场</text>
    <text x="543" y="146" font-size="19" fill="#57606a">1 km 分辨率</text>

    <line x1="188" y1="115" x2="228" y2="115" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="411" y1="115" x2="451" y2="115" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
